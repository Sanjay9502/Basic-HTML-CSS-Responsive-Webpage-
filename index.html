<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & CSS Assignment</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navigation Bar (Question 3) -->
    <nav class="navbar">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>
    </nav>

    <!-- Simple Webpage (Question 1) -->
    <div class="content-section">
        <h1>Welcome to Our Website</h1>
        <p>This is a sample paragraph that demonstrates the basic structure of our webpage. We're showcasing various HTML and CSS features as part of this assignment.</p>
        <img src="https://picsum.photos/400/300" alt="Sample Image" class="featured-image">
    </div>

    <!-- Centered Div (Question 2) -->
    <div class="centered-container">
        <div class="centered-div">
            This div is centered both vertically and horizontally
        </div>
    </div>

    <!-- Contact Form (Question 4) -->
    <div class="form-container">
        <form class="contact-form">
            <h2>Contact Us</h2>
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>
            </div>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
